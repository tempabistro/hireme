<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyPilot AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0f1e;
      color: #f1f5f9;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #111827, #1e293b);
      border-bottom: 1px solid #1e293b;
    }

    .header .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
    }

    .header span {
      font-size: 11px;
      color: #94a3b8;
    }

    .content {
      padding: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .status.detecting {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }

    .status.found {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.blue { background: #3b82f6; }
    .dot.green { background: #10b981; }
    .dot.red { background: #ef4444; }
    .dot.pulse { animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .job-preview {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .job-preview h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .job-preview .meta {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .job-preview .meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .job-preview .snippet {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
    }

    .settings {
      margin-bottom: 16px;
    }

    .settings label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .settings input, .settings select {
      width: 100%;
      padding: 8px 12px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 13px;
      outline: none;
    }

    .settings input:focus, .settings select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #111827;
      color: #94a3b8;
      border: 1px solid #1e293b;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      border-color: #3b82f6;
      color: #f1f5f9;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }

    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h1>ApplyPilot AI</h1>
      <span>Job Importer</span>
    </div>
  </div>

  <div class="content">
    <!-- Status -->
    <div id="status" class="status detecting">
      <div class="dot blue pulse"></div>
      <span>Scanning page for job posting...</span>
    </div>

    <!-- Job preview -->
    <div id="jobPreview" class="job-preview hidden">
      <h3 id="jobTitle">-</h3>
      <div class="meta">
        <span id="jobCompany">-</span>
        <span id="jobLocation">-</span>
      </div>
      <div class="snippet" id="jobSnippet">-</div>
    </div>

    <!-- Settings -->
    <div class="settings">
      <label>ApplyPilot URL</label>
      <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="https://your-applypilot.vercel.app" />
    </div>

    <!-- Buttons -->
    <button id="importBtn" class="btn btn-primary" disabled>
      <span>⚡</span> Import to ApplyPilot
    </button>
    <button id="openAppBtn" class="btn btn-secondary">
      Open ApplyPilot Dashboard
    </button>
  </div>

  <div class="footer">
    Powered by <a href="#">ApplyPilot AI</a> — Your job search ops manager
  </div>

  <script src="popup.js"></script>
</body>
</html>
